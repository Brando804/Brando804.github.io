<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obrigado pelo contato | Uniferro</title>

    <!-- FAVICON (Ícone do site) -->
    <link rel="icon" href="HOME/index.home/storage/Geral/icone-UNIFERRO-1-2png_1de93382-5183-4ae7-8e15-ed530223e9c9.png">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a; /* Fundo mais escuro como o site original */
            color: #fff;
            overflow-x: hidden;
        }

        /* Faixa lateral vermelha */
        .left-bar {
            position: fixed;
            left: 0;
            top: 0;
            width: 80px;
            height: 100vh;
            background: #890504; /* Vermelho Uniferro */
            z-index: 10;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Shape diagonal escuro */
        .diagonal {
            position: absolute;
            top: 0;
            left: 0;
            width: 70%;
            height: 100%;
            background: #111;
            clip-path: polygon(0 0, 75% 0, 45% 100%, 0% 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 120px;
            z-index: 2;
        }

        /* Card principal */
        .card {
            position: relative;
            max-width: 700px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .subtitle {
            color: #890504;
            letter-spacing: 4px;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 14px;
        }

        h1 {
            color: #fff;
            font-size: 52px;
            line-height: 1.1;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            color: #bbb;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* Botões */
        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 35px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: .3s;
            display: inline-flex;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .btn-primary {
            background: #890504;
            color: #fff;
        }
        .btn-primary:hover {
            background: #a50705;
            transform: scale(1.05);
        }

        /* Ícone check */
        .check {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #890504;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            font-size: 30px;
            color: #fff;
            box-shadow: 0 10px 20px rgba(137, 5, 4, 0.3);
        }

        @media(max-width:900px){
            .diagonal { width: 100%; clip-path: none; background: rgba(0,0,0,0.8); }
            .container { padding: 40px; padding-left: 40px; text-align: center; }
            .left-bar { width: 100%; height: 5px; top: 0; left: 0; }
            .check { margin: 0 auto 30px; }
            .buttons { justify-content: center; }
            h1 { font-size: 32px; }
            p { font-size: 16px; }
        }
    </style>
</head>

<body>

<div class="left-bar"></div>
<div class="diagonal"></div>

<div class="container">
    <div class="card">
        
        <div class="check">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
        
        <div class="subtitle">Mensagem Recebida</div>
        <h1>Obrigado pelo seu contato!</h1>

        <p>
            Sua mensagem foi enviada com sucesso para nossa central de atendimento.  
            Nossa equipe técnica entrará em contato com você o mais breve possível.
        </p>

        <div class="buttons">
            <a href="index.html" class="btn btn-primary">Voltar ao início</a>
        </div>

    </div>
</div>

</body>
</html>
