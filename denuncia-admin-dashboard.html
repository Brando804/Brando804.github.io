<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Comitê de Conduta</title>
    
    <link rel="icon" href="CONTATO/storage/Geral/cache/icone-UNIFERRO-1-2png_1de93382-5183-4ae7-8e15-ed530223e9c9-144-148.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: #0d0d0d;
            color: #fff;
            display: flex;
            flex-direction: column;
            border-right: 4px solid #880202;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 10;
        }
        .sidebar-header {
            padding: 2rem;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .sidebar-header img {
            width: 140px;
            margin-bottom: 1rem;
        }
        .sidebar-header p {
            font-size: 0.9rem;
            color: #aaa;
        }
        .sidebar-nav {
            padding: 2rem 0;
            flex-grow: 1;
        }
        .nav-item {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #ccc;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #222;
            color: #fff;
            border-left: 4px solid #880202;
        }
        .sidebar-footer {
            padding: 2rem;
            border-top: 1px solid #333;
        }
        .btn-logout {
            background: transparent;
            color: #ff4c4c;
            border: 1px solid #ff4c4c;
            padding: 0.8rem;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .btn-logout:hover {
            background: #ff4c4c;
            color: #fff;
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 2rem 4rem;
            width: calc(100% - 260px);
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            border-bottom: 1px solid #e2e2e2;
            padding-bottom: 1.5rem;
        }
        .topbar h1 {
            font-size: 1.8rem;
            color: #1a1a1a;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #880202;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            background: #fff;
            padding: 1.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border-left: 4px solid #880202;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stat-card.warning { border-color: #f39c12; }
        .stat-card.success { border-color: #27ae60; }
        
        .stat-title {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            font-weight: bold;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1a1a1a;
        }

        /* Filters */
        .filters-bar {
            background: #fff;
            padding: 1.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
        }
        .filter-group label {
            font-size: 0.85rem;
            color: #888;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .filter-input {
            padding: 0.8rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            min-width: 200px;
        }
        .btn-filter {
            background: #111;
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
        }
        
        /* Table */
        .table-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            overflow: hidden;
        }
        .table-header {
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .table-header h2 {
            font-size: 1.2rem;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #eee;
            border-radius: 0 0 8px 8px;
        }
        th {
            background-color: #f4f6f8;
            font-size: 0.9rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 1.2rem 2rem;
            border-bottom: 2px solid #ddd;
            cursor: pointer;
            user-select: none;
            position: relative;
            text-align: left;
        }
        th:hover {
            background-color: #e2e6ea;
        }
        th.sort-asc::after { content: " ▲"; color: #880202; position: absolute; right: 10px; }
        th.sort-desc::after { content: " ▼"; color: #880202; position: absolute; right: 10px; }
        td {
            padding: 1.2rem 2rem;
            border-bottom: 1px solid #eee;
            border-right: 1px solid #eee;
            text-align: left;
        }
        td:last-child { border-right: none; }
        tr:nth-child(even) {
            background-color: #fafafa;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .status-badge {
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-novo { background: #ffebee; color: #c62828; }
        .status-analise { background: #fff8e1; color: #f57f17; }
        .status-concluido { background: #e8f5e9; color: #2e7d32; }
        
        .btn-view {
            background: transparent;
            border: 1px solid #880202;
            color: #880202;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        .btn-view:hover {
            background: #880202;
            color: #fff;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal {
            background: #fff;
            width: 100%;
            max-width: 700px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }
        .modal-header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            border-radius: 8px 8px 0 0;
        }
        .modal-header h2 {
            color: #880202;
        }
        .btn-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #888;
        }
        .modal-body {
            padding: 2rem;
            overflow-y: auto;
        }
        .detail-group {
            margin-bottom: 1.5rem;
        }
        .detail-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }
        .detail-value {
            font-size: 1.1rem;
            color: #111;
            line-height: 1.5;
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .modal-footer {
            padding: 1.5rem 2rem;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            align-items: center;
        }
        
        .status-select {
            padding: 0.6rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }
        .btn-save {
            background: #880202;
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        /* Responsividade */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; min-height: auto; padding: 1rem; display: flex; flex-direction: column; align-items: center; position: relative; }
            .sidebar-nav { display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-top: 1rem; padding:0; }
            .nav-item { margin-bottom: 0; padding: 0.5rem 1rem; }
            .sidebar-footer { margin-top: 1rem; padding: 1rem; width: 100%; text-align: center; }
            
            .main-content { margin-left: 0; width: 100%; padding: 1rem; }
            .dashboard-header { flex-direction: column; gap: 1rem; text-align: center; }
            .stats-grid { grid-template-columns: 1fr; gap: 1rem; }
            
            .filters-bar { flex-direction: column; align-items: stretch; gap: 1rem; }
            .filter-input { width: 100%; box-sizing: border-box; }
            .btn-filter { width: 100%; box-sizing: border-box; margin-top:0.5rem; }
            
            .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            table { min-width: 800px; }
            
            .modal { width: 95%; padding: 0; }
            .modal-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .modal-body { padding: 1rem; }
            .modal-body > div { grid-template-columns: 1fr !important; }
            .modal-footer { flex-direction: column; align-items: stretch; }
            .modal-footer select { margin-bottom: 1rem; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Security Check Removed (Now handled by Firebase module) -->

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="HOME/index.home/storage/Geral/cache/vectorpng_e6055350-9b59-40fe-8a7a-aa4a3119b350-387-51.png" alt="Uniferro">
            <p>Comitê de Conduta</p>
        </div>
        <div class="sidebar-nav">
            <a class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Painel Geral
        </div>
        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()">Sair do Sistema</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <h1>Gestão de Denúncias</h1>
            <div class="user-info">
                <span>Comitê Uniferro</span>
                <div class="user-avatar">C</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div>
                    <div class="stat-title">Novos / Não Lidos</div>
                    <div class="stat-value">2</div>
                </div>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
            <div class="stat-card warning">
                <div>
                    <div class="stat-title">Em Apuração</div>
                    <div class="stat-value">3</div>
                </div>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#f39c12" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="stat-card success">
                <div>
                    <div class="stat-title">Concluídos</div>
                    <div class="stat-value">12</div>
                </div>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#27ae60" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>
        </div>

        <div class="filters-bar">
            <div class="filter-group">
                <label>Assunto</label>
                <select class="filter-input" id="filterAssunto">
                    <option value="Todos">Todos</option>
                    <option value="Assédio Moral">Assédio Moral</option>
                    <option value="Assédio Sexual">Assédio Sexual</option>
                    <option value="Conduta Inadequada">Conduta Inadequada</option>
                    <option value="Conflito de Interesses">Conflito de Interesses</option>
                    <option value="Fraude / Corrupção">Fraude / Corrupção</option>
                    <option value="Meio Ambiente">Meio Ambiente</option>
                    <option value="Segurança do Trabalho">Segurança do Trabalho</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Período</label>
                <select class="filter-input" id="filterPeriodo" onchange="toggleCustomDates()">
                    <option value="Todos">Todo o Período</option>
                    <option value="Hoje">Hoje</option>
                    <option value="Esta Semana">Esta Semana</option>
                    <option value="Este Mês">Este Mês</option>
                    <option value="Este Ano">Este Ano</option>
                    <option value="Personalizado">Personalizado</option>
                </select>
            </div>
            <div class="filter-group custom-date-group" style="display:none;">
                <label>Data Inicial</label>
                <input type="date" class="filter-input" id="filterDateStart">
            </div>
            <div class="filter-group custom-date-group" style="display:none;">
                <label>Data Final</label>
                <input type="date" class="filter-input" id="filterDateEnd">
            </div>
            <button class="btn-filter" onclick="applyFilters()">Aplicar Filtros</button>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>Relatos Recentes</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th onclick="handleSort('protocolo')">Protocolo</th>
                        <th onclick="handleSort('timestamp')">Data</th>
                        <th onclick="handleSort('assunto')">Assunto</th>
                        <th onclick="handleSort('relacao')">Relação</th>
                        <th onclick="handleSort('idType')">Identificação</th>
                        <th onclick="handleSort('status')">Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Javascript will populate this -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal details -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Detalhes do Protocolo <span id="modProto"></span></h2>
                <div style="display:flex; align-items:center; gap: 1rem;">
                    <button onclick="exportPDF()" style="background:transparent; border:1px solid #333; color:#333; padding:0.4rem 1rem; border-radius:4px; font-weight:bold; cursor:pointer; font-size:0.9rem;">📄 Exportar PDF</button>
                    <button class="btn-close" onclick="closeModal()">×</button>
                </div>
            </div>
            <div class="modal-body">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                    <div class="detail-group" style="margin-bottom:0;">
                        <div class="detail-label">Data de Envio</div>
                        <div class="detail-value" id="modData"></div>
                    </div>
                    <div class="detail-group" style="margin-bottom:0;">
                        <div class="detail-label">Assunto Principal</div>
                        <div class="detail-value" id="modAssunto"></div>
                    </div>
                </div>

                <div class="detail-group">
                    <div class="detail-label">Dados do Relator</div>
                    <div class="detail-value" id="modRelator"></div>
                </div>

                <div class="detail-group">
                    <div class="detail-label">Descrição dos Fatos</div>
                    <div class="detail-value" id="modDesc"></div>
                </div>
                
                <div class="detail-group" id="modAnexosGroup" style="display: none;">
                    <div class="detail-label">Anexos</div>
                    <div class="detail-value" style="color: #0066cc; cursor:pointer;" id="modAnexos">
                        <!-- Anexos entram aqui -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <div>
                    <label style="font-size:0.9rem; font-weight:bold; margin-right:0.5rem;">Alterar Status:</label>
                    <select class="status-select" id="newStatus">
                        <option value="Novo">Novo (Não Lido)</option>
                        <option value="Análise">Em Apuração</option>
                        <option value="Concluído">Concluído</option>
                    </select>
                </div>
                <button class="btn-save" onclick="window.saveStatus()">Salvar Alteração</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, auth, onAuthStateChanged, signOut, collection, onSnapshot, doc, updateDoc } from './firebase-config.js';

        // Check if user is logged in
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'denuncia-admin-login';
            }
        });

        window.logout = function() {
            signOut(auth).then(() => {
                window.location.href = 'denuncia-admin-login';
            });
        };

        // DB Data
        let allReports = [];
        let filteredReports = [];
        let currentSort = { col: null, dir: 'default' }; 
        let currentActiveId = null;

        // Firebase Realtime Listener
        onSnapshot(collection(db, "reports"), (snapshot) => {
            allReports = [];
            snapshot.forEach((doc) => {
                allReports.push({ id: doc.id, ...doc.data() });
            });
            applyFilters();
            updateStats();
        });

        function renderTable(data = filteredReports) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if(data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #888;">Nenhuma denúncia encontrada para este filtro.</td></tr>';
                return;
            }

            data.forEach(r => {
                let statusClass = r.status === 'Novo' ? 'status-novo' : (r.status === 'Análise' ? 'status-analise' : 'status-concluido');
                let idBadge = r.idType === 'Anônimo' ? '<span style="color:#666; font-style:italic;">🔒 Anônimo</span>' : '👤 Identificado';

                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight:bold; color:#880202;">${r.protocolo}</td>
                        <td>${r.data}</td>
                        <td>${r.assunto}</td>
                        <td>${r.relacao}</td>
                        <td>${idBadge}</td>
                        <td><span class="status-badge ${statusClass}">${r.status}</span></td>
                        <td><button class="btn-view" onclick="window.openModal('${r.id}')">Analisar</button></td>
                    </tr>
                `;
            });
        }
        
        window.toggleCustomDates = function() {
            const isCustom = document.getElementById('filterPeriodo').value === 'Personalizado';
            document.querySelectorAll('.custom-date-group').forEach(el => {
                el.style.display = isCustom ? 'flex' : 'none';
            });
        };

        window.applyFilters = function() {
            const assunto = document.getElementById('filterAssunto').value;
            const periodo = document.getElementById('filterPeriodo').value;
            
            let result = [...allReports];
            
            if(assunto !== 'Todos') {
                result = result.filter(r => r.assunto === assunto);
            }
            
            const now = new Date();
            let startOfFilter = new Date(0);
            
            if(periodo === 'Hoje') {
                startOfFilter = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                result = result.filter(r => r.timestamp >= startOfFilter.getTime());
            } else if(periodo === 'Esta Semana') {
                const day = now.getDay();
                const diff = now.getDate() - day + (day === 0 ? -6:1);
                startOfFilter = new Date(now.setDate(diff));
                startOfFilter.setHours(0,0,0,0);
                result = result.filter(r => r.timestamp >= startOfFilter.getTime());
            } else if(periodo === 'Este Mês') {
                startOfFilter = new Date(now.getFullYear(), now.getMonth(), 1);
                result = result.filter(r => r.timestamp >= startOfFilter.getTime());
            } else if(periodo === 'Este Ano') {
                startOfFilter = new Date(now.getFullYear(), 0, 1);
                result = result.filter(r => r.timestamp >= startOfFilter.getTime());
            } else if(periodo === 'Personalizado') {
                const sDate = document.getElementById('filterDateStart').value;
                const eDate = document.getElementById('filterDateEnd').value;
                if(sDate) {
                    const startTs = new Date(sDate + "T00:00:00").getTime();
                    result = result.filter(r => r.timestamp >= startTs);
                }
                if(eDate) {
                    const endTs = new Date(eDate + "T23:59:59").getTime();
                    result = result.filter(r => r.timestamp <= endTs);
                }
            }
            
            filteredReports = result;
            applySort(); // applies sort and renders
        };

        window.handleSort = function(col) {
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });

            if (currentSort.col === col) {
                if (currentSort.dir === 'asc') currentSort.dir = 'desc';
                else if (currentSort.dir === 'desc') { currentSort.col = null; currentSort.dir = 'default'; }
            } else {
                currentSort.col = col;
                currentSort.dir = 'asc';
            }
            
            applySort();
        };

        function applySort() {
            if (currentSort.dir === 'default' || !currentSort.col) {
                filteredReports.sort((a, b) => b.timestamp - a.timestamp);
            } else {
                filteredReports.sort((a, b) => {
                    let valA = a[currentSort.col];
                    let valB = b[currentSort.col];
                    
                    if(typeof valA === 'string') valA = valA.toLowerCase();
                    if(typeof valB === 'string') valB = valB.toLowerCase();

                    if (valA < valB) return currentSort.dir === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.dir === 'asc' ? 1 : -1;
                    return 0;
                });
                
                const headers = document.querySelectorAll('th');
                const colNames = ['protocolo', 'timestamp', 'assunto', 'relacao', 'idType', 'status'];
                const index = colNames.indexOf(currentSort.col);
                if(index > -1) {
                    headers[index].classList.add(currentSort.dir === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            }
            renderTable();
        }

        window.openModal = function(id) {
            const report = allReports.find(r => r.id === id);
            if(!report) return;
            
            currentActiveId = id;
            
            document.getElementById('modProto').innerText = report.protocolo;
            document.getElementById('modData').innerText = report.data;
            document.getElementById('modAssunto').innerText = report.assunto;
            document.getElementById('modDesc').innerText = report.desc;
            
            let relatorInfo = `<strong>Relação:</strong> ${report.relacao} <br> <strong>Tipo:</strong> ${report.idType}`;
            if(report.idType === 'Identificado') {
                relatorInfo += `<br><br><strong>Nome:</strong> ${report.nome} <br><strong>E-mail:</strong> ${report.email} <br><strong>Telefone:</strong> ${report.tel}`;
            } else {
                relatorInfo += `<br><br><span style="color:#c62828;">Dados protegidos pelo sigilo de denúncia anônima.</span>`;
            }
            document.getElementById('modRelator').innerHTML = relatorInfo;
            
            // Exibir anexos
            const anexosGroup = document.getElementById('modAnexosGroup');
            const anexosDiv = document.getElementById('modAnexos');
            if(report.anexos && report.anexos.length > 0) {
                anexosGroup.style.display = 'block';
                let links = report.anexos.map(a => `<a href="${a.url}" target="_blank" style="display:block; margin-bottom:5px; color:#0066cc; text-decoration:underline;">Ver ${a.name}</a>`).join('');
                anexosDiv.innerHTML = links;
            } else {
                anexosGroup.style.display = 'none';
                anexosDiv.innerHTML = '';
            }
            
            document.getElementById('newStatus').value = report.status;
            document.getElementById('modalOverlay').style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('modalOverlay').style.display = 'none';
            currentActiveId = null;
        };

        window.exportPDF = function() {
            if(!currentActiveId) return;
            const report = allReports.find(r => r.id === currentActiveId);
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>${report.protocolo}_${report.assunto.replace(/ /g, '_')}</title>
                    <style>
                        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; color: #111; line-height: 1.6; }
                        .header { border-bottom: 2px solid #880202; padding-bottom: 20px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
                        h1 { color: #880202; font-size: 22px; margin: 0 0 5px 0; }
                        .meta { color: #666; font-size: 14px; }
                        .section { margin-bottom: 30px; }
                        .section h3 { font-size: 14px; text-transform: uppercase; color: #888; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; }
                        .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
                        .data-box { background: #f9f9f9; padding: 15px; border-radius: 6px; border: 1px solid #eee; }
                        .label { font-size: 12px; text-transform: uppercase; color: #888; font-weight: bold; margin-bottom: 5px; display: block; }
                        .value { font-size: 15px; font-weight: 500; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <div>
                            <h1>Relatório de Infração - Confidencial</h1>
                            <div class="meta">Documento interno protegido por sigilo.</div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h3>1. Classificação Geral</h3>
                        <div class="data-grid">
                            <div class="data-box">
                                <span class="label">Protocolo</span>
                                <span class="value" style="color:#880202; font-weight:bold;">${report.protocolo}</span>
                            </div>
                            <div class="data-box">
                                <span class="label">Data de Envio</span>
                                <span class="value">${report.data}</span>
                            </div>
                            <div class="data-box">
                                <span class="label">Assunto / Categoria</span>
                                <span class="value">${report.assunto}</span>
                            </div>
                            <div class="data-box">
                                <span class="label">Status Atual</span>
                                <span class="value">${report.status}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="section">
                        <h3>2. Identificação do Relator</h3>
                        <div class="data-box">
                            <span class="label">Tipo e Relação</span>
                            <span class="value" style="margin-bottom: 15px; display:block;">${report.idType} - ${report.relacao}</span>
                            
                            ${report.idType === 'Identificado' ? 
                            `<div style="display:flex; gap:30px; border-top:1px solid #eee; padding-top:15px;">
                                <div><span class="label">Nome</span><span class="value">${report.nome}</span></div>
                                <div><span class="label">E-mail</span><span class="value">${report.email}</span></div>
                                <div><span class="label">Telefone</span><span class="value">${report.tel}</span></div>
                            </div>` 
                            : `<div style="border-top:1px solid #eee; padding-top:15px; color:#666; font-style:italic;">Dados protegidos pelo sigilo de denúncia anônima. A plataforma não retém endereço de IP ou metadados de identificação.</div>`}
                        </div>
                    </div>
                    
                    <div class="section">
                        <h3>3. Descrição Detalhada dos Fatos</h3>
                        <div class="data-box" style="white-space: pre-wrap;">${report.desc}</div>
                    </div>
                    
                    ${report.anexos && report.anexos.length > 0 ? `
                    <div class="section">
                        <h3>4. Evidências Anexadas</h3>
                        <div class="data-box">
                            ${report.anexos.map(a => `<a href="${a.url}" target="_blank" style="color:#0066cc;">${a.name}</a>`).join('<br>')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <div style="margin-top: 60px; font-size: 11px; color: #999; text-align: center; border-top: 1px solid #eee; padding-top: 20px;">
                        Gerado pelo Painel de Gestão - Uniferro<br>
                        ${new Date().toLocaleDateString('pt-BR')} às ${new Date().toLocaleTimeString('pt-BR')}
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            printWindow.focus();
            
            setTimeout(() => {
                printWindow.print();
            }, 500);
        };

        window.saveStatus = async function() {
            if(currentActiveId) {
                const newStatus = document.getElementById('newStatus').value;
                const reportRef = doc(db, "reports", currentActiveId);
                
                try {
                    const btn = document.querySelector('.btn-save');
                    btn.innerText = 'Salvando...';
                    await updateDoc(reportRef, { status: newStatus });
                    
                    window.closeModal();
                    alert("Status atualizado com sucesso no banco de dados.");
                } catch(e) {
                    console.error("Erro ao atualizar status: ", e);
                    alert("Falha de permissão ou conexão com o servidor seguro.");
                } finally {
                    document.querySelector('.btn-save').innerText = 'Salvar Alteração';
                }
            }
        };

        function updateStats() {
            const novos = allReports.filter(r => r.status === 'Novo').length;
            const analise = allReports.filter(r => r.status === 'Análise').length;
            const concluidos = allReports.filter(r => r.status === 'Concluído').length;
            
            const stats = document.querySelectorAll('.stat-value');
            if(stats.length >= 3) {
                stats[0].innerText = novos;
                stats[1].innerText = analise;
                stats[2].innerText = concluidos;
            }
        }
    </script>
</body>
</html>
